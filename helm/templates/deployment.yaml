{{- if ne .Values.site.stage "preview" }}
{{- fail "This release supports site.stage=preview only; public launch integration gates remain unresolved" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elementa.fullname" . }}
  labels:
    {{- include "elementa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "elementa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elementa.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "elementa.serviceAccount" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: elementa
          image: {{ include "elementa.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: SITE_STAGE
              value: {{ .Values.site.stage | quote }}
            - name: SITE_ORIGIN
              value: {{ .Values.site.origin | quote }}
            - name: FESTIVAL_FACTS_APPROVED
              value: {{ .Values.site.festivalFactsApproved | quote }}
            - name: ANNOUNCEMENT_INSTANT_APPROVED
              value: {{ .Values.site.announcementInstantApproved | quote }}
          {{- if .Values.existingEnvSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingEnvSecret | quote }}
          {{- end }}
          # Probe a real SSR page, including the publication-configuration gate.
          startupProbe:
            httpGet: {path: /es, port: http}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /es, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 128Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
