name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_STAGE: preview
      SITE_ORIGIN: https://elementafestival.com
      FESTIVAL_FACTS_APPROVED: 'false'
      ANNOUNCEMENT_INSTANT_APPROVED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - run: python3 -m pip install PyYAML==6.0.2
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: python3 helm/test-chart.py
      - run: python3 -m unittest discover -s tests -p 'delivery*.py' -v
