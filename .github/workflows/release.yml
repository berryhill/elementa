name: Release and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Serialize the entire publication/deployment transaction; never interrupt a rollback.
concurrency:
  group: elementa-production
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'berryhill/elementa'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/berryhill/elementa:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/berryhill/elementa
            org.opencontainers.image.revision=${{ github.sha }}
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://elementafestival.com
    permissions:
      contents: read
      packages: read
    env:
      LINODE_KUBECONFIG: ${{ secrets.LINODE_KUBECONFIG }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      SIGNUP_ALLOWED_ORIGIN: ${{ secrets.SIGNUP_ALLOWED_ORIGIN }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      RELEASE_SHA: ${{ github.sha }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.32.3
      - run: python3 -m pip install PyYAML==6.0.2
      - name: Helm deploy
        run: python3 scripts/deploy.py
